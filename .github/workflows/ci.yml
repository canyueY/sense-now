name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python runners
        shell: pwsh
        run: |
          python -m py_compile `
            scripts/audio-visual-runner.py `
            scripts/asr-runner.py `
            scripts/loopback-recorder.py `
            examples/floating-chat/window.py `
            examples/floating-chat/window_protocol.py `
            examples/floating-chat/mic.py

      - name: Run test suite
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run --json
